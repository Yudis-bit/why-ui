version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /tests/dogfood/vite
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      framework:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /tests/dogfood/next
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      framework:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
