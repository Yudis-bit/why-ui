name: Diagnostic request
description: Describe a concrete browser question and the evidence that would help.
title: '[Idea] '
body:
  - type: textarea
    id: problem
    attributes:
      label: The interaction problem
      description: What cannot you determine with the existing inspect/verify loop? Include a small example.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Useful evidence and current workaround
      description: Describe the result you need. Runtime truth must stay deterministic and non-activating.
    validations:
      required: true
