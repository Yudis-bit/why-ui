name: Framework compatibility
description: Source mapping or HMR behavior in a particular development setup.
title: '[Compatibility] '
body:
  - type: input
    id: setup
    attributes:
      label: Framework and toolchain
      description: Exact framework, React, bundler, why-ui, Chrome and OS versions; dev or production mode.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal public reproduction and startup command
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What is missing or incorrect?
      description: Target detection, source references/certainty, HMR readiness, or verification. Redact private paths and payloads.
    validations:
      required: true
